name = "lean-fun"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanFun", "Analysis"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0-rc8"

[[lean_lib]]
name = "LeanFun"

[[lean_lib]]
name = "Analysis"
leanOptions = { doc.verso = true, weak.linter.mathlibStandardSet = false }
moreLeanArgs = ["-Dwarn.sorry=false"]
